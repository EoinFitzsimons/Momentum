name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Lint and test (Python 3.12)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Momentum/Python/requirements.txt
          pip install -r Momentum/Python/requirements-dev.txt

      # Only real errors fail the build: syntax errors, undefined names,
      # broken comparisons. Style is left to the editor.
      - name: Lint for errors
        run: |
          cd Momentum/Python
          python -m flake8 . --select=E9,F63,F7,F82 --exclude=.venv,.venv312,htmlcov

      # Wall-clock benchmarks are excluded: shared runners miss their targets.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd Momentum/Python
          python -m pytest tests/ -m "not performance" --tb=short
