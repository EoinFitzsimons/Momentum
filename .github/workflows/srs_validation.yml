name: SRS Validation & Tests

on:
  push:
    branches: [ main, report-work, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  srs-validation:
    runs-on: ubuntu-latest
    name: SRS Requirements & Schema Validation

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Momentum/Python/requirements.txt
          pip install -r Momentum/Python/requirements-dev.txt
          pip install jsonschema pytest pytest-cov

      - name: Verify SRS artifacts exist
        run: |
          test -f SRS/requirements.yaml || (echo "SRS/requirements.yaml not found" && exit 1)
          test -f SRS/determinism.md || (echo "SRS/determinism.md not found" && exit 1)
          test -f SRS/perf_profiles.md || (echo "SRS/perf_profiles.md not found" && exit 1)
          test -f SRS/state_machine.md || (echo "SRS/state_machine.md not found" && exit 1)
          test -f SRS/failure_modes.md || (echo "SRS/failure_modes.md not found" && exit 1)
          test -f SRS/event_contract.md || (echo "SRS/event_contract.md not found" && exit 1)
          echo " All SRS markdown artifacts present"

      - name: Verify JSON Schemas exist
        run: |
          test -f SRS/schemas/driver.schema.json || (echo "Missing SRS/schemas/driver.schema.json" && exit 1)
          test -f SRS/schemas/team.schema.json || (echo "Missing SRS/schemas/team.schema.json" && exit 1)
          test -f SRS/schemas/track.schema.json || (echo "Missing SRS/schemas/track.schema.json" && exit 1)
          test -f SRS/schemas/result.schema.json || (echo "Missing SRS/schemas/result.schema.json" && exit 1)
          test -f SRS/event_schemas/lap_complete.schema.json || (echo "Missing lap_complete schema" && exit 1)
          test -f SRS/event_schemas/overtake.schema.json || (echo "Missing overtake schema" && exit 1)
          test -f SRS/event_schemas/incident.schema.json || (echo "Missing incident schema" && exit 1)
          echo " All JSON schemas present"

      - name: Validate JSON Schemas are valid JSON
        run: |
          python3 << 'EOF'
          import json
          import glob
          for schema_file in glob.glob("SRS/schemas/*.json") + glob.glob("SRS/event_schemas/*.json"):
              try:
                  with open(schema_file) as f:
                      json.load(f)
                  print(f" {schema_file}")
              except json.JSONDecodeError as e:
                  print(f"✗ {schema_file}: {e}")
                  exit(1)
          EOF

      - name: Verify test fixtures
        run: |
          test -f SRS/fixtures/example_racecontext.json || (echo "Missing SRS/fixtures/example_racecontext.json" && exit 1)
          echo " Test fixtures present"

  reproducibility-tests:
    runs-on: ubuntu-latest
    name: Reproducibility Tests (R-SIM-001)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Momentum/Python/requirements.txt
          pip install -r Momentum/Python/requirements-dev.txt
          pip install pytest pytest-cov jsonschema

      - name: Run reproducibility tests
        run: |
          cd Momentum/Python
          python -m pytest tests/test_simulation_reproducibility.py -v --tb=short

      - name: Report reproducibility results
        if: always()
        run: |
          echo "::group::Reproducibility Test Summary"
          cd Momentum/Python
          python -m pytest tests/test_simulation_reproducibility.py -v --tb=line || true
          echo "::endgroup::"

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests (SRS Contracts & Schemas)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Momentum/Python/requirements.txt
          pip install -r Momentum/Python/requirements-dev.txt
          pip install pytest pytest-cov jsonschema

      - name: Run integration tests
        run: |
          cd Momentum/Python
          python -m pytest tests/test_integration_srs.py -v --tb=short

      - name: Report integration test results
        if: always()
        run: |
          echo "::group::Integration Test Summary"
          cd Momentum/Python
          python -m pytest tests/test_integration_srs.py -v --tb=line || true
          echo "::endgroup::"

  test-coverage:
    runs-on: ubuntu-latest
    name: Test Coverage Report

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Momentum/Python/requirements.txt
          pip install -r Momentum/Python/requirements-dev.txt
          pip install pytest pytest-cov jsonschema

      - name: Run tests with coverage
        run: |
          cd Momentum/Python
          python -m pytest tests/ --cov=services --cov=RaceLogic --cov=tools --cov-report=term-missing --cov-report=html

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Momentum/Python/htmlcov

  linting:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8

      - name: Lint race simulation API
        run: |
          python -m pylint Momentum/Python/services/race_simulation_api.py --disable=all --enable=E,F || true

      - name: Flake8 check
        run: |
          python -m flake8 Momentum/Python/services/race_simulation_api.py --max-line-length=120 --extend-ignore=E501 || true

  srs-documentation:
    runs-on: ubuntu-latest
    name: SRS Documentation

    steps:
      - uses: actions/checkout@v4

      - name: Verify employment analysis exists
        run: |
          test -f EMPLOYMENT_ANALYSIS.md || (echo "EMPLOYMENT_ANALYSIS.md not found" && exit 1)
          echo " Employment analysis document present"

      - name: Verify developer runbook exists
        run: |
          test -f DEVELOPER_RUNBOOK.md || (echo "DEVELOPER_RUNBOOK.md not found" && exit 1)
          echo " Developer runbook present"

      - name: Verify SRS README exists
        run: |
          test -f SRS/README.md || (echo "SRS/README.md not found" && exit 1)
          echo " SRS README present"

      - name: Verify requirements.yaml structure
        run: |
          python3 << 'EOF'
          import yaml
          with open("SRS/requirements.yaml") as f:
              reqs = yaml.safe_load(f)
          assert "requirements" in reqs, "requirements.yaml missing 'requirements' key"
          assert len(reqs["requirements"]) > 0, "No requirements defined"
          for req in reqs["requirements"]:
              assert "id" in req, f"Requirement missing 'id': {req}"
              assert "title" in req, f"Requirement {req.get('id')} missing 'title'"
              assert "acceptance_criteria" in req, f"Requirement {req.get('id')} missing 'acceptance_criteria'"
          print(f" requirements.yaml is valid: {len(reqs['requirements'])} requirements defined")
          EOF

  summary:
    runs-on: ubuntu-latest
    name: CI Summary
    if: always()
    needs: [ srs-validation, reproducibility-tests, integration-tests, linting, srs-documentation ]

    steps:
      - name: Print CI Summary
        run: |
          echo "::notice:: SRS Validation & Tests Complete"
          echo " SRS artifacts verified"
          echo " Reproducibility tests (R-SIM-001)"
          echo " Integration tests (discipline adapters, event schemas, failure modes)"
          echo " Code quality checks"
          echo " Documentation"
          echo ""
          echo "See job logs above for details."
