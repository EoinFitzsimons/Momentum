requirements:
  - id: R-SIM-001
    title: Deterministic simulation execution
    description: |
      Given an identical RaceContext and integer seed, the simulation engine
      shall produce identical serialized event streams and final standings.
    acceptance_criteria:
      - For each canonical fixture in `SRS/fixtures/` running the simulation
        with the same seed at least 5 times must yield byte-for-byte identical
        serialized outputs (events.json and results.json).
    tests:
      - Momentum/Python/mvp_tests/test_simulation_reproducibility.py
    owner: Simulation Team
    priority: high
    verification: CI automated unit tests

  - id: R-SIM-002
    title: Realtime mode and event streaming
    description: |
      Engine shall support realtime execution with `realtime_speed`, an
      `event_callback` for streaming events, and a `stop_event` mechanism for
      graceful cancellation.
    acceptance_criteria:
      - Realtime run accepts `realtime_speed` float > 0 and streams events to
        callback in monotonic lap order. `stop_event` triggers graceful shutdown
        and persists last consistent state.
    tests:
      - Momentum/Python/mvp_tests/test_realtime_stop_and_streaming.py
    owner: UI/Integration
    priority: high
    verification: functional and integration tests

  - id: R-DISC-001
    title: Discipline adapter contract
    description: |
      Every discipline adapter shall implement BaseDisciplineEngine contract
      providing get_attribute_weights, calculate_lap_time, and
      simulate_race(context) or delegate to the realtime engine.
    acceptance_criteria:
      - Adapter instances must be constructible given optional seed and
        produce lap-time values consistent with documented ranges.
    tests:
      - Momentum/Python/mvp_tests/test_discipline_adapter_contract.py
    owner: Design
    priority: medium
    verification: unit tests

